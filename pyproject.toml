[project]
name = "retirement-pet"
version = "1.1.1"
description = "RetirementPet - a quiet desktop companion counting down to retirement"
requires-python = ">=3.12"
dependencies = [
    "PySide6==6.8.3",
]

[project.optional-dependencies]
dev = [
    "PyInstaller>=6,<7",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
